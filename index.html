<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashback - My Moments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6ab5ff; --bg: #f8fbff; --white: #ffffff; --shadow: 0 10px 30px rgba(0,0,0,0.05); }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #444; overflow-x: hidden; }

        /* شاشة الدخول */
        .lock-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; text-align: center; position: fixed; width: 100%; z-index: 3000; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .icon-character { width: 150px; margin-bottom: 20px; animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .lock-screen h1 { font-size: 32px; margin: 10px 0; color: #333; }
        .lock-screen p { color: #aaa; margin-bottom: 30px; font-size: 16px; }
        .unlock-btn { background: var(--primary); color: white; border: none; padding: 15px 80px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(106, 181, 255, 0.4); }

        .app-container { display: none; }

        /* الهيدر والبحث */
        .top-nav { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; background: var(--white); }
        .search-container { padding: 0 20px 15px; }
        .search-box { background: #f1f3f6; padding: 12px 20px; border-radius: 15px; display: flex; align-items: center; gap: 10px; }
        .search-box input { border: none; background: transparent; outline: none; flex: 1; font-family: inherit; }

        /* القائمة الجانبية */
        .side-menu { position: fixed; top: 0; right: -280px; width: 260px; height: 100%; background: var(--white); z-index: 4000; transition: 0.4s; box-shadow: -5px 0 20px rgba(0,0,0,0.1); padding-top: 50px; }
        .side-menu.active { right: 0; }
        .menu-item { padding: 15px 25px; display: flex; align-items: center; gap: 15px; font-size: 16px; cursor: pointer; }
        .menu-item i { color: var(--primary); width: 20px; }
        .menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 3500; }

        /* التايملاين والمنشورات */
        .header-title { padding: 10px 25px; font-size: 22px; font-weight: bold; }
        .posts-area { padding-bottom: 120px; }
        .post-card { background: white; margin: 15px 20px; padding: 18px; border-radius: 25px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02); }
        .post-user { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-user img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .post-content-img { width: 100%; border-radius: 15px; margin-top: 10px; display: block; }

        /* البروفايل */
        .profile-bg { background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%); height: 160px; border-radius: 0 0 50px 50px; }
        .profile-card { background: white; margin: -60px 25px 20px; padding: 30px 20px; border-radius: 35px; text-align: center; box-shadow: var(--shadow); }
        .pfp-container { width: 110px; height: 110px; background: #f0f0f0; border-radius: 50%; margin: -85px auto 15px; border: 5px solid white; position: relative; overflow: hidden; }
        .pfp-container img { width: 100%; height: 100%; object-fit: cover; }
        .pfp-edit { position: absolute; bottom: 0; right: 0; background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white; cursor: pointer; }

        .detail-input { background: white; margin: 0 25px 15px; padding: 18px; border-radius: 22px; display: flex; align-items: center; box-shadow: var(--shadow); gap: 15px; }
        .detail-input i { color: var(--primary); font-size: 18px; width: 25px; text-align: center; }
        .detail-input input { border: none; outline: none; flex: 1; font-family: inherit; font-size: 15px; color: #555; }

        /* المنيو السفلي */
        .bottom-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 85%; background: white; height: 75px; border-radius: 40px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 1000; }
        .nav-link { color: #d1d9e6; font-size: 24px; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; }
        .nav-link span { font-size: 10px; display: block; margin-top: 4px; }
        .nav-link.active { color: var(--primary); }
        .add-trigger { background: var(--primary); width: 62px; height: 62px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -55px; border: 6px solid var(--bg); box-shadow: 0 10px 20px rgba(106, 181, 255, 0.3); cursor: pointer; }

        /* مودال النشر */
        #publish-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .box-content { background: white; width: 85%; padding: 30px; border-radius: 30px; }
        textarea { width: 100%; height: 100px; border: 1.5px solid #f0f0f0; border-radius: 15px; padding: 12px; outline: none; resize: none; font-family: inherit; margin-bottom: 10px; }

        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="lock-screen" id="gate">
    <img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png" class="icon-character" alt="Welcome">
    <h1>Flashback</h1>
    <p>أهلاً وسهلاً~ ✨</p>
    <button class="unlock-btn" onclick="unlockApp()">دخول</button>
</div>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-item"><i class="fa-solid fa-compass"></i> استكشاف</div>
    <div class="menu-item"><i class="fa-solid fa-bell"></i> التنبيهات</div>
    <div class="menu-item"><i class="fa-solid fa-gear"></i> الإعدادات</div>
    <div class="menu-item" style="color: #ff7675;"><i class="fa-solid fa-door-open"></i> خروج</div>
</div>

<div class="app-container" id="app-body">
    <div id="home-view" class="screen active">
        <div class="top-nav">
            <i class="fa-solid fa-bars" style="font-size: 22px; cursor: pointer;" onclick="toggleMenu()"></i>
            <span style="font-weight: bold;">Flashback</span>
            <i class="fa-regular fa-bell" style="font-size: 20px;"></i>
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #ccc;"></i>
                <input type="text" id="search-input" placeholder="بحث في الذكريات..." oninput="filterPosts()">
            </div>
        </div>
        <div class="header-title">أجمل الذكريات ✨</div>
        <div id="feed-list" class="posts-area"></div>
    </div>

    <div id="user-view" class="screen">
        <div class="profile-bg"></div>
        <div class="profile-card">
            <div class="pfp-container">
                <img id="my-pfp" src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png">
                <label class="pfp-edit"><i class="fa-solid fa-camera"></i><input type="file" hidden onchange="changePfp(this)"></label>
            </div>
            <h3 id="label-name" style="margin:0;">اسم المستخدم</h3>
            <p id="label-meta" style="color:#bbb; font-size:12px; margin-top:5px;">لم تحدد البيانات</p>
        </div>

        <div class="detail-input"><i class="fa-solid fa-user"></i><input type="text" id="set-name" placeholder="الاسم الشخصي" oninput="updateProfile()"></div>
        <div class="detail-input"><i class="fa-solid fa-star"></i><input type="text" id="set-role" placeholder="المنصب أو الرتبة" oninput="updateProfile()"></div>
        <div class="detail-input"><i class="fa-solid fa-school"></i><input type="text" id="set-grade" placeholder="الصف الدراسي" oninput="updateProfile()"></div>
    </div>

    <div class="bottom-bar">
        <div class="nav-link active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </div>
        <div class="add-trigger" onclick="openPublish(true)"><i class="fa-solid fa-plus"></i></div>
        <div class="nav-link" onclick="switchTab('user', this)">
            <i class="fa-solid fa-user"></i>
            <span>حسابي</span>
        </div>
    </div>
</div>

<div id="publish-box">
    <div class="box-content">
        <h3 style="margin-top:0;">إضافة ذكرى جديدة</h3>
        <textarea id="msg-text" placeholder="اكتبي شيئاً للذكرى.."></textarea>
        <div style="margin-bottom:15px;">
            <input type="file" id="msg-file" hidden accept="image/*" onchange="document.getElementById('file-status').innerText='تم اختيار صورة ✅'">
            <label for="msg-file" style="color:var(--primary); cursor:pointer; font-weight:bold;"><i class="fa-solid fa-image"></i> إرفاق صورة</label>
            <span id="file-status" style="font-size:12px; color:gray; margin-right:10px;"></span>
        </div>
        <button onclick="publishToCloud()" style="width:100%; background:var(--primary); color:white; border:none; padding:15px; border-radius:20px; font-weight:bold;">نشر الآن</button>
        <button onclick="openPublish(false)" style="width:100%; background:none; border:none; color:#999; margin-top:10px;">إلغاء</button>
    </div>
</div>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAEE414kUNvzTpWKao0VYHQC5linSrHFbA",
        authDomain: "flashback-70367.firebaseapp.com",
        projectId: "flashback-70367",
        storageBucket: "flashback-70367.firebasestorage.app",
        messagingSenderId: "802996244307",
        appId: "1:802996244307:web:6f3ff7c053e361b878dba6",
        measurementId: "G-GV6F1S1J63",
        databaseURL: "https://flashback-70367-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const cloudRef = ref(db, 'memories_v5');

    window.unlockApp = () => {
        document.getElementById('gate').style.transform = "translateY(-100%)";
        setTimeout(() => { document.getElementById('gate').style.display = "none"; document.getElementById('app-body').style.display = "block"; }, 600);
    };

    window.toggleMenu = () => {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        menu.classList.toggle('active');
        overlay.style.display = menu.classList.contains('active') ? 'block' : 'none';
    };

    window.switchTab = (id, el) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id + '-view').classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    };

    window.openPublish = (s) => document.getElementById('publish-box').style.display = s ? 'flex' : 'none';

    window.updateProfile = () => {
        const n = document.getElementById('set-name').value, r = document.getElementById('set-role').value, g = document.getElementById('set-grade').value;
        localStorage.setItem('u_name', n); localStorage.setItem('u_role', r); localStorage.setItem('u_grade', g);
        document.getElementById('label-name').innerText = n || "اسم المستخدم";
        document.getElementById('label-meta').innerText = (r || g) ? `${r} - ${g}` : "لم تحدد البيانات";
    };

    window.changePfp = (i) => {
        if(i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { document.getElementById('my-pfp').src = e.target.result; localStorage.setItem('u_pfp', e.target.result); };
            r.readAsDataURL(i.files[0]);
        }
    };

    window.publishToCloud = async () => {
        const text = document.getElementById('msg-text').value, file = document.getElementById('msg-file').files[0];
        if(!text && !file) return;
        let b64 = null;
        if(file) {
            const r = new FileReader();
            b64 = await new Promise(res => {
                r.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 400; canvas.height = (img.height / img.width) * 400;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.5));
                    };
                    img.src = e.target.result;
                };
                r.readAsDataURL(file);
            });
        }
        push(cloudRef, {
            sender: localStorage.getItem('u_name') || "مستخدم مجهول",
            meta: `${localStorage.getItem('u_role') || ""} - ${localStorage.getItem('u_grade') || ""}`,
            pfp: localStorage.getItem('u_pfp') || "https://via.placeholder.com/150",
            content: text, img: b64, time: new Date().toLocaleTimeString('ar-SA')
        });
        document.getElementById('msg-text').value = ""; document.getElementById('msg-file').value = "";
        openPublish(false);
    };

    let allPosts = [];
    onValue(cloudRef, (snap) => {
        const data = snap.val();
        allPosts = data ? Object.keys(data).map(k => data[k]).reverse() : [];
        renderPosts(allPosts);
    });

    function renderPosts(arr) {
        const list = document.getElementById('feed-list'); list.innerHTML = "";
        arr.forEach(m => {
            list.innerHTML += `<div class="post-card">
                <div class="post-user"><img src="${m.pfp}"><div class="user-meta"><b>${m.sender}</b><span>${m.meta} • ${m.time}</span></div></div>
                <p>${m.content}</p>
                ${m.img ? `<img src="${m.img}" style="width:100%; border-radius:15px; margin-top:10px;">` : ""}
            </div>`;
        });
    }

    window.filterPosts = () => {
        const q = document.getElementById('search-input').value.toLowerCase();
        renderPosts(allPosts.filter(m => m.content.toLowerCase().includes(q) || m.sender.toLowerCase().includes(q)));
    };

    window.onload = () => {
        document.getElementById('set-name').value = localStorage.getItem('u_name') || "";
        document.getElementById('set-role').value = localStorage.getItem('u_role') || "";
        document.getElementById('set-grade').value = localStorage.getItem('u_grade') || "";
        if(localStorage.getItem('u_pfp')) document.getElementById('my-pfp').src = localStorage.getItem('u_pfp');
        updateProfile();
    };

</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAEE414kUNvzTpWKao0VYHQC5linSrHFbA",
    authDomain: "flashback-70367.firebaseapp.com",
    projectId: "flashback-70367",
    storageBucket: "flashback-70367.firebasestorage.app",
    messagingSenderId: "802996244307",
    appId: "1:802996244307:web:6f3ff7c053e361b878dba6",
    measurementId: "G-GV6F1S1J63",
    // السطر اللي تحت هو اللي ناقصك وهو اللي بيخلي النشر يشتغل ✅
    databaseURL: "https://flashback-70367-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const cloudRef = ref(db, 'memories_v5');

  // هنا تحطين باقي وظائف النشر (publishToCloud) وعرض المنشورات (onValue)
</script>
</body>
</html>
